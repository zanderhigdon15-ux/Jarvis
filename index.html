<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050a12">
<title>J.A.R.V.I.S.</title>

<style>
:root {
  --accent: #48dfff;
  --accent-soft: rgba(72,223,255,.14);
  --bg: #050a12;
  --panel: rgba(9,22,36,.92);
  --text: #e8f8ff;
  --muted: #83a5b8;
  --border: rgba(72,223,255,.22);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  background:
    radial-gradient(ellipse at center, #10263b 0%, #07111e 42%, #03070d 100%);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
}

body.edith {
  --accent: #ff526d;
  --accent-soft: rgba(255,82,109,.14);
  --border: rgba(255,82,109,.25);
}

body.friday {
  --accent: #b78aff;
  --accent-soft: rgba(183,138,255,.14);
  --border: rgba(183,138,255,.25);
}

body.jarvis {
  --accent: #48dfff;
  --accent-soft: rgba(72,223,255,.14);
  --border: rgba(72,223,255,.22);
}

button, input, select, textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

.ambient {
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .3;
  background-image:
    linear-gradient(rgba(72,223,255,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(72,223,255,.035) 1px, transparent 1px);
  background-size: 45px 45px;
  mask-image: linear-gradient(to bottom, black, transparent 90%);
}

header {
  position: relative;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 22px 26px;
  z-index: 2;
}

.brand {
  letter-spacing: 4px;
  font-size: 13px;
  font-weight: bold;
}

.brand span {
  color: var(--accent);
}

.status {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 2px;
  text-align: right;
}

.status-dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  margin-right: 7px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 12px var(--accent);
}

main {
  position: relative;
  z-index: 1;
  width: min(900px, 100%);
  margin: auto;
  padding: 15px 22px 70px;
  text-align: center;
}

.personality {
  color: var(--accent);
  font-size: 11px;
  letter-spacing: 5px;
  margin-top: 20px;
}

.greeting {
  margin: 12px 0 0;
  font-size: clamp(25px, 6vw, 40px);
  font-weight: 300;
  letter-spacing: 3px;
}

.subtitle {
  color: var(--muted);
  font-size: 12px;
  margin-top: 10px;
  letter-spacing: 1px;
}

.core-area {
  position: relative;
  width: 290px;
  height: 290px;
  margin: 25px auto 10px;
  display: grid;
  place-items: center;
}

.core-button {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  border: 1px solid var(--accent);
  background:
    radial-gradient(circle at 35% 30%, rgba(255,255,255,.35), transparent 15%),
    radial-gradient(circle, var(--accent-soft), rgba(2,10,20,.96) 72%);
  box-shadow:
    0 0 22px var(--accent-soft),
    inset 0 0 28px var(--accent-soft);
  color: var(--accent);
  display: grid;
  place-items: center;
  position: relative;
  z-index: 3;
  transition: .3s;
}

.core-button:focus-visible {
  outline: 3px solid white;
  outline-offset: 7px;
}

.core-button:active {
  transform: scale(.96);
}

.core-symbol {
  font-size: 44px;
  font-weight: 200;
  text-shadow: 0 0 20px var(--accent);
}

.orbit {
  position: absolute;
  border: 1px solid var(--border);
  border-radius: 50%;
  animation: rotate 18s linear infinite;
}

.orbit.one {
  width: 205px;
  height: 205px;
  border-left-color: transparent;
  border-right-color: var(--accent);
}

.orbit.two {
  width: 255px;
  height: 255px;
  border-top-color: transparent;
  border-bottom-color: var(--accent);
  animation-direction: reverse;
  animation-duration: 25s;
}

.orbit.three {
  width: 285px;
  height: 285px;
  border-style: dashed;
  opacity: .45;
  animation-duration: 45s;
}

@keyframes rotate {
  to { transform: rotate(360deg); }
}

body.listening .core-button {
  box-shadow: 0 0 55px var(--accent), inset 0 0 35px var(--accent-soft);
  animation: pulse 1.2s ease-in-out infinite alternate;
}

body.thinking .core-button {
  box-shadow: 0 0 42px var(--accent);
  animation: pulse .7s ease-in-out infinite alternate;
}

body.speaking .core-button {
  box-shadow: 0 0 35px var(--accent);
  animation: pulse .45s ease-in-out infinite alternate;
}

@keyframes pulse {
  from { transform: scale(1); }
  to { transform: scale(1.07); }
}

.core-hint {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 3px;
  margin-top: 10px;
}

.response {
  width: min(640px, 100%);
  min-height: 94px;
  margin: 22px auto;
  padding: 19px;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  background: linear-gradient(90deg, transparent, rgba(10,28,43,.48), transparent);
  text-align: left;
}

.response-label {
  font-size: 9px;
  letter-spacing: 3px;
  color: var(--accent);
  margin-bottom: 10px;
}

.response-text {
  font-size: 14px;
  line-height: 1.7;
  color: #d7edf8;
  overflow-wrap: anywhere;
}

.panel {
  width: min(680px, 100%);
  margin: 25px auto;
  padding: 22px;
  border: 1px solid var(--border);
  background: var(--panel);
  border-radius: 10px;
  text-align: left;
  display: none;
  animation: appear .25s ease;
}

.panel.open { display: block; }

@keyframes appear {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.panel h2 {
  font-size: 14px;
  letter-spacing: 3px;
  font-weight: 400;
  color: var(--accent);
  margin: 0 0 18px;
}

.panel h3 {
  font-size: 12px;
  color: var(--accent);
  letter-spacing: 1px;
  margin-top: 22px;
}

.field {
  display: block;
  width: 100%;
  margin: 10px 0;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 5px;
  background: rgba(0,0,0,.3);
  color: var(--text);
}

.field::placeholder {
  color: #668397;
}

.action {
  border: 1px solid var(--accent);
  color: var(--accent);
  background: var(--accent-soft);
  border-radius: 5px;
  padding: 11px 15px;
  margin: 5px 5px 5px 0;
  font-size: 11px;
  letter-spacing: 1px;
}

.action:hover {
  background: var(--accent);
  color: #04101a;
}

.item {
  padding: 13px 0;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
}

.item-main {
  min-width: 0;
}

.item-title {
  font-size: 13px;
  overflow-wrap: anywhere;
}

.item-meta {
  color: var(--muted);
  font-size: 10px;
  margin-top: 5px;
}

.delete {
  color: #ff8493;
  border: 0;
  background: transparent;
  padding: 8px;
}

.empty {
  color: var(--muted);
  font-size: 12px;
  padding: 12px 0;
}

footer {
  color: #567386;
  font-size: 9px;
  letter-spacing: 2px;
  text-align: center;
  padding: 20px;
}

.small-note {
  color: var(--muted);
  font-size: 11px;
  line-height: 1.6;
}

.hidden {
  display: none !important;
}

@media(max-width:500px) {
  header { padding: 18px 16px; }
  main { padding-left: 15px; padding-right: 15px; }
  .core-area { transform: scale(.92); margin-top: 12px; margin-bottom: 0; }
  .panel { padding: 17px; }
}
</style>
</head>

<body class="jarvis">

<div class="ambient"></div>

<header>
  <div class="brand">J.A.R.V.I.S. <span>// SYSTEM</span></div>
  <div class="status">
    <span class="status-dot"></span>
    <span id="systemStatus">STANDBY</span>
  </div>
</header>

<main>
  <div class="personality" id="personalityLabel">J.A.R.V.I.S.</div>
  <h1 class="greeting" id="greeting">Good to see you.</h1>
  <div class="subtitle">PERSONAL INTELLIGENCE SYSTEM</div>

  <div class="core-area">
    <div class="orbit one"></div>
    <div class="orbit two"></div>
    <div class="orbit three"></div>

    <button class="core-button" id="coreButton" aria-label="Activate voice assistant">
      <span class="core-symbol">J</span>
    </button>
  </div>

  <div class="core-hint" id="coreHint">TAP TO SPEAK</div>

  <section class="response" aria-live="polite">
    <div class="response-label" id="responseLabel">JARVIS // READY</div>
    <div class="response-text" id="responseText">
      Standing by. How may I assist?
    </div>
  </section>

  <section class="panel" id="panel">
    <h2 id="panelTitle">SYSTEM PANEL</h2>
    <div id="panelContent"></div>
  </section>
</main>

<footer>
  J.A.R.V.I.S. PERSONAL SYSTEM // LOCAL PROTOTYPE
</footer>

<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);

const STORAGE_KEY = "jarvis_personal_system_v3";

const defaults = {
  personality: "jarvis",
  interjections: "balanced",
  speed: 1,
  voiceName: "",
  tasks: [],
  assignments: [],
  memories: [],
  history: []
};

let data = loadData();
let recognition = null;
let listening = false;
let currentPanel = "";
let availableVoices = [];
let initialized = false;

function loadData() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    return { ...defaults, ...saved };
  } catch {
    return structuredClone(defaults);
  }
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch {
    respond("I couldn't save that information. Your browser storage may be full or unavailable.");
  }
}

function setState(state) {
  document.body.classList.remove("listening", "thinking", "speaking");
  if (state) document.body.classList.add(state);

  const labels = {
    idle: "STANDBY",
    listening: "LISTENING",
    thinking: "PROCESSING",
    speaking: "RESPONDING"
  };

  $("systemStatus").textContent = labels[state || "idle"] || "STANDBY";

  $("coreHint").textContent = ({
    idle: "TAP TO SPEAK",
    listening: "LISTENING // TAP TO STOP",
    thinking: "PROCESSING",
    speaking: "RESPONDING"
  })[state || "idle"];
}

function personalityInfo() {
  return {
    jarvis: {
      name: "J.A.R.V.I.S.",
      symbol: "J",
      color: "jarvis"
    },
    edith: {
      name: "E.D.I.T.H.",
      symbol: "E",
      color: "edith"
    },
    friday: {
      name: "F.R.I.D.A.Y.",
      symbol: "F",
      color: "friday"
    }
  }[data.personality] || {
    name: "J.A.R.V.I.S.",
    symbol: "J",
    color: "jarvis"
  };
}

function updatePersonality() {
  const p = personalityInfo();
  document.body.classList.remove("jarvis", "edith", "friday");
  document.body.classList.add(p.color);
  $("personalityLabel").textContent = p.name;
  $("coreButton").querySelector(".core-symbol").textContent = p.symbol;
  $("responseLabel").textContent = p.name + " // READY";
}

function speak(text) {
  if (!("speechSynthesis" in window)) return;

  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.rate = Number(data.speed) || 1;

  const voice = availableVoices.find(v => v.name === data.voiceName);
  if (voice) utterance.voice = voice;

  utterance.onstart = () => setState("speaking");
  utterance.onend = () => setState("idle");
  utterance.onerror = () => setState("idle");

  window.speechSynthesis.speak(utterance);
}

function respond(message, shouldSpeak = true) {
  $("responseText").textContent = message;
  $("responseLabel").textContent = personalityInfo().name + " // RESPONSE";
  setState("idle");

  data.history.push({
    message,
    personality: data.personality,
    timestamp: new Date().toISOString()
  });

  if (data.history.length > 40) data.history.shift();
  saveData();

  if (shouldSpeak) speak(message);
}

function createRecognition() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) return null;

  const r = new SpeechRecognition();
  r.lang = "en-US";
  r.continuous = false;
  r.interimResults = false;
  r.maxAlternatives = 1;

  r.onstart = () => {
    listening = true;
    setState("listening");
  };

  r.onresult = event => {
    const transcript = event.results[0][0].transcript;
    listening = false;
    setState("thinking");
    handleCommand(transcript);
  };

  r.onerror = event => {
    listening = false;
    setState("idle");

    if (event.error === "not-allowed") {
      respond("Microphone permission is blocked. Please allow microphone access in your browser settings.");
    } else if (event.error !== "no-speech") {
      respond("I couldn't process that voice input. Please try again.");
    }
  };

  r.onend = () => {
    listening = false;
    if (!document.body.classList.contains("thinking") &&
        !document.body.classList.contains("speaking")) {
      setState("idle");
    }
  };

  return r;
}

function toggleListening() {
  if (listening && recognition) {
    recognition.stop();
    listening = false;
    setState("idle");
    return;
  }

  if (!recognition) {
    respond("Voice recognition isn't supported in this browser. You can open the typing panel by saying so only when voice recognition is available. Use the browser's supported speech recognition or a compatible device.");
    return;
  }

  try {
    recognition.start();
  } catch {
    respond("The microphone is already starting. Give it a moment.");
  }
}

function normalize(text) {
  return text
    .toLowerCase()
    .replace(/[^\w\s'-]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function handleCommand(raw) {
  const text = normalize(raw);
  if (!text) {
    respond("I didn't catch that. Try again.");
    return;
  }

  if (text.includes("switch to edith") || text === "edith") {
    switchPersonality("edith");
    return;
  }

  if (text.includes("switch to friday") || text === "friday") {
    switchPersonality("friday");
    return;
  }

  if (text.includes("switch to jarvis") || text === "jarvis") {
    switchPersonality("jarvis");
    return;
  }

  if (text.includes("open tasks") || text.includes("show tasks")) {
    openPanel("tasks");
    return;
  }

  if (text.includes("open academics") ||
      text.includes("open assignments") ||
      text.includes("show assignments")) {
    openPanel("academics");
    return;
  }

  if (text.includes("open memory") || text.includes("show memory")) {
    openPanel("memory");
    return;
  }

  if (text.includes("open settings") || text.includes("system settings")) {
    openPanel("settings");
    return;
  }

  if (text.includes("open typing") || text.includes("show typing")) {
    openPanel("typing");
    return;
  }

  if (text.includes("close panel") || text.includes("close window")) {
    closePanel();
    respond("Panel closed.");
    return;
  }

  if (text.includes("what time")) {
    respond("The current time is " +
      new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }));
    return;
  }

  if (text.includes("what date") || text.includes("today's date")) {
    respond("Today is " +
      new Date().toLocaleDateString([], {
        weekday: "long", month: "long", day: "numeric", year: "numeric"
      }));
    return;
  }

  if (text.includes("how many tasks")) {
    respond("You currently have " + data.tasks.length + " active tasks.");
    return;
  }

  if (text.includes("how many assignments")) {
    respond("You currently have " + data.assignments.length + " assignments saved.");
    return;
  }

  if (text.startsWith("add task ")) {
    const title = raw.slice(raw.toLowerCase().indexOf("add task") + 9).trim();
    if (title) addTask(title);
    return;
  }

  if (text.startsWith("remember ")) {
    const note = raw.slice(raw.toLowerCase().indexOf("remember") + 9).trim();
    if (note) addMemory(note);
    return;
  }

  if (text.includes("help")) {
    respond("You can ask me to open tasks, open academics, open memory, open settings, switch to EDITH, switch to FRIDAY, switch to JARVIS, add a task, or remember something.");
    return;
  }

  if (data.personality === "edith") {
    respond("I can manage your local system functions, but I don't have access to a full AI reasoning engine yet. Give me a supported command.");
  } else if (data.personality === "friday") {
    respond("I'd love to help, but my full intelligence engine isn't connected yet. Try one of the available commands.");
  } else {
    respond("I understand the request, but my full AI engine isn't connected yet. I can manage tasks, assignments, memory, settings, and supported voice commands.");
  }
}

function switchPersonality(name) {
  data.personality = name;
  saveData();
  updatePersonality();

  const messages = {
    jarvis: "JARVIS online. I'll coordinate your system.",
    edith: "EDITH online. Security and permissions remain my priority.",
    friday: "FRIDAY online. Let's make this a little less boring."
  };

  respond(messages[name]);
}

function openPanel(name) {
  currentPanel = name;
  $("panel").classList.add("open");
  renderPanel();
  $("panel").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function closePanel() {
  currentPanel = "";
  $("panel").classList.remove("open");
}

function addTask(title) {
  data.tasks.push({
    id: crypto.randomUUID(),
    title,
    created: new Date().toISOString()
  });

  saveData();
  if (currentPanel === "tasks") renderPanel();
  respond("I've added that to your tasks.");
}

function addAssignment(title, course, due) {
  data.assignments.push({
    id: crypto.randomUUID(),
    title,
    course,
    due
  });

  saveData();
  if (currentPanel === "academics") renderPanel();
  respond("Assignment saved.");
}

function addMemory(note) {
  data.memories.push({
    id: crypto.randomUUID(),
    note,
    created: new Date().toISOString()
  });

  saveData();
  if (currentPanel === "memory") renderPanel();
  respond("I've saved that as a local memory note.");
}

function deleteItem(collection, id) {
  if (!["tasks", "assignments", "memories"].includes(collection)) return;

  data[collection] = data[collection].filter(item => item.id !== id);
  saveData();
  renderPanel();
}

function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function createItem(title, meta, collection, id) {
  const row = element("div", "item");
  const main = element("div", "item-main");
  main.appendChild(element("div", "item-title", title));
  main.appendChild(element("div", "item-meta", meta));

  const remove = element("button", "delete", "REMOVE");
  remove.type = "button";
  remove.addEventListener("click", () => deleteItem(collection, id));

  row.append(main, remove);
  return row;
}

function addSectionHeading(parent, title) {
  parent.appendChild(element("h3", "", title));
}

function addEmpty(parent, message) {
  parent.appendChild(element("div", "empty", message));
}

function renderPanel() {
  const content = $("panelContent");
  content.replaceChildren();

  const titles = {
    tasks: "TASK MANAGEMENT",
    academics: "ACADEMIC SYSTEM",
    memory: "PERSONAL MEMORY",
    settings: "SYSTEM CONFIGURATION",
    typing: "TEXT INPUT"
  };

  $("panelTitle").textContent = titles[currentPanel] || "SYSTEM PANEL";

  if (currentPanel === "tasks") renderTasks(content);
  if (currentPanel === "academics") renderAcademics(content);
  if (currentPanel === "memory") renderMemory(content);
  if (currentPanel === "settings") renderSettings(content);
  if (currentPanel === "typing") renderTyping(content);
}

function renderTasks(parent) {
  const input = element("input", "field");
  input.placeholder = "Describe a task...";
  input.id = "newTask";

  const button = element("button", "action", "ADD TASK");
  button.type = "button";
  button.addEventListener("click", () => {
    const value = input.value.trim();
    if (value) addTask(value);
  });

  parent.append(input, button);
  addSectionHeading(parent, "ACTIVE TASKS");

  if (!data.tasks.length) addEmpty(parent, "No tasks saved.");

  data.tasks.forEach(task => {
    parent.appendChild(createItem(
      task.title,
      "Added " + new Date(task.created).toLocaleDateString(),
      "tasks",
      task.id
    ));
  });
}

function renderAcademics(parent) {
  const title = element("input", "field");
  title.placeholder = "Assignment name";

  const course = element("input", "field");
  course.placeholder = "Class";

  const due = element("input", "field");
  due.type = "date";

  const button = element("button", "action", "SAVE ASSIGNMENT");
  button.type = "button";
  button.addEventListener("click", () => {
    if (!title.value.trim() || !course.value.trim()) {
      respond("Please enter an assignment name and class.");
      return;
    }

    addAssignment(title.value.trim(), course.value.trim(), due.value);
  });

  parent.append(title, course, due, button);
  addSectionHeading(parent, "ASSIGNMENTS");

  if (!data.assignments.length) addEmpty(parent, "No assignments saved.");

  data.assignments.forEach(item => {
    parent.appendChild(createItem(
      item.title,
      item.course + (item.due ? " // Due " + item.due : " // No due date"),
      "assignments",
      item.id
    ));
  });
}

function renderMemory(parent) {
  const input = element("textarea", "field");
  input.placeholder = "Add a personal note or preference...";
  input.rows = 3;

  const button = element("button", "action", "SAVE NOTE");
  button.type = "button";
  button.addEventListener("click", () => {
    const value = input.value.trim();
    if (value) addMemory(value);
  });

  parent.append(input, button);

  parent.appendChild(element(
    "p",
    "small-note",
    "These are local notes saved in this browser. They are not encrypted or synced."
  ));

  addSectionHeading(parent, "SAVED NOTES");

  if (!data.memories.length) addEmpty(parent, "No notes saved.");

  data.memories.forEach(item => {
    parent.appendChild(createItem(
      item.note,
      "Saved " + new Date(item.created).toLocaleDateString(),
      "memories",
      item.id
    ));
  });
}

function renderSettings(parent) {
  addSectionHeading(parent, "ACTIVE PERSONALITY");

  ["jarvis", "edith", "friday"].forEach(name => {
    const button = element("button", "action", name.toUpperCase());
    button.type = "button";
    button.addEventListener("click", () => switchPersonality(name));
    parent.appendChild(button);
  });

  addSectionHeading(parent, "VOICE SPEED");

  const speed = element("input", "field");
  speed.type = "range";
  speed.min = ".75";
  speed.max = "1.25";
  speed.step = ".05";
  speed.value = data.speed;

  speed.addEventListener("input", () => {
    data.speed = Number(speed.value);
    saveData();
  });

  parent.appendChild(speed);

  const speedLabel = element("div", "small-note", "Current speed: " + data.speed);
  speed.addEventListener("change", () => {
    speedLabel.textContent = "Current speed: " + data.speed;
  });
  parent.appendChild(speedLabel);

  addSectionHeading(parent, "VOICE SELECTION");

  const voiceSelect = element("select", "field");
  voiceSelect.appendChild(new Option("Default device voice", ""));

  availableVoices.forEach(voice => {
    voiceSelect.appendChild(new Option(voice.name + " (" + voice.lang + ")", voice.name));
  });

  voiceSelect.value = data.voiceName;

  voiceSelect.addEventListener("change", () => {
    data.voiceName = voiceSelect.value;
    saveData();
  });

  parent.appendChild(voiceSelect);

  const preview = element("button", "action", "TEST VOICE");
  preview.type = "button";
  preview.addEventListener("click", () => speak("System voice test. JARVIS is ready."));
  parent.appendChild(preview);

  addSectionHeading(parent, "INTERJECTIONS");

  const frequency = element("select", "field");
  ["minimal", "balanced", "frequent"].forEach(value => {
    frequency.appendChild(new Option(value, value));
  });

  frequency.value = data.interjections;
  frequency.addEventListener("change", () => {
    data.interjections = frequency.value;
    saveData();
  });

  parent.appendChild(frequency);

  addSectionHeading(parent, "DATA BACKUP");

  const backup = element("button", "action", "EXPORT BACKUP");
  backup.type = "button";
  backup.addEventListener("click", exportBackup);

  const restore = element("button", "action", "RESTORE BACKUP");
  restore.type = "button";

  const file = element("input", "field");
  file.type = "file";
  file.accept = "application/json";
  file.setAttribute("aria-label", "Choose a JARVIS backup file");

  restore.addEventListener("click", () => file.click());

  file.addEventListener("change", restoreBackup);

  parent.append(backup, restore, file);

  addSectionHeading(parent, "LOCAL DATA");

  const warning = element(
    "p",
    "small-note",
    "Clearing local data permanently removes saved tasks, assignments, and notes from this browser. Export a backup first."
  );

  const clear = element("button", "action", "CLEAR LOCAL DATA");
  clear.type = "button";
  clear.addEventListener("click", () => {
    if (!confirm("Delete all locally saved JARVIS information? This cannot be undone.")) return;

    data = structuredClone(defaults);
    saveData();
    updatePersonality();
    renderPanel();
    respond("Local data cleared.");
  });

  parent.append(warning, clear);
}

function renderTyping(parent) {
  const input = element("textarea", "field");
  input.placeholder = "Type a command...";
  input.rows = 3;

  const send = element("button", "action", "SEND");
  send.type = "button";
  send.addEventListener("click", () => {
    const text = input.value.trim();
    if (!text) return;
    closePanel();
    setState("thinking");
    handleCommand(text);
  });

  parent.append(input, send);
  input.focus();
}

function exportBackup() {
  const blob = new Blob([JSON.stringify(data, null, 2)], {
    type: "application/json"
  });

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "jarvis-backup.json";
  a.click();
  URL.revokeObjectURL(url);
  respond("Backup exported.");
}

function restoreBackup(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = () => {
    try {
      const imported = JSON.parse(reader.result);

      if (!imported || typeof imported !== "object" ||
          !Array.isArray(imported.tasks) ||
          !Array.isArray(imported.assignments) ||
          !Array.isArray(imported.memories)) {
        throw new Error("Invalid backup");
      }

      if (!confirm("Replace your current local data with this backup?")) return;

      data = { ...defaults, ...imported };
      saveData();
      updatePersonality();
      renderPanel();
      respond("Backup restored.");
    } catch {
      respond("That file doesn't appear to be a valid JARVIS backup.");
    }
  };

  reader.readAsText(file);
}

function initializeVoices() {
  if (!("speechSynthesis" in window)) return;

  availableVoices = window.speechSynthesis.getVoices();

  if (currentPanel === "settings") renderPanel();
}

if ("speechSynthesis" in window) {
  initializeVoices();
  window.speechSynthesis.onvoiceschanged = initializeVoices;
}

$("coreButton").addEventListener("click", toggleListening);

updatePersonality();
recognition = createRecognition();

if (!recognition) {
  $("coreHint").textContent = "VOICE RECOGNITION UNAVAILABLE";
}

const hour = new Date().getHours();

$("greeting").textContent =
  hour < 12 ? "Good morning." :
  hour < 18 ? "Good afternoon." :
  "Good evening.";

if (!initialized) {
  initialized = true;
  $("responseText").textContent =
    "Standing by. Tap the central core to begin a voice session. Say 'help' for supported commands.";
}

})();
</script>
