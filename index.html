<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta name="description" content="Personal assistant interface">
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="./styles.css">
<title>JARVIS</title>
</head>
<body>
<div class="ambient"></div>
<div class="grid"></div>

<header class="topline">
  <span class="brand">J.A.R.V.I.S.</span>
  <span id="status">LOCAL SYSTEM · READY</span>
</header>

<main>
  <section class="stage">
    <div class="orbit orbit-a"></div>
    <div class="orbit orbit-b"></div>

    <button id="core" class="core" aria-label="Activate assistant">
      <span class="core-inner">
        <span id="coreMark">J</span>
      </span>
    </button>

    <div class="identity">
      <div id="personaName">JARVIS</div>
      <small id="stateText">STANDING BY</small>
    </div>

    <p class="hint">TAP THE CORE TO SPEAK · OR TYPE BELOW</p>
  </section>

  <section class="console">
    <div id="messages" class="messages" aria-live="polite">
      <div class="message system">
        <b>JARVIS</b>
        <p>Systems online. This build runs locally in your browser. Some advanced services require a separately deployed backend.</p>
      </div>
    </div>

    <form id="commandForm">
      <input id="command" autocomplete="off" placeholder="Talk to JARVIS…" aria-label="Message">
      <button type="submit">SEND</button>
    </form>

    <div class="quickrow">
      <button data-command="Open tasks">TASKS</button>
      <button data-command="Open school">ACADEMICS</button>
      <button data-command="Open memory">MEMORY</button>
      <button data-command="Open settings">SETTINGS</button>
    </div>
  </section>

  <section id="panel" class="panel hidden" aria-live="polite">
    <div class="panel-head">
      <span id="panelTitle">SYSTEM</span>
      <button id="closePanel" aria-label="Close panel">×</button>
    </div>
    <div id="panelBody"></div>
  </section>
</main>

<footer>
  JARVIS PERSONAL SYSTEM
  <span>LOCAL MODE · V1</span>
</footer>

<script src="./app.js"></script>
</body>
</html>
