<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>JARVIS | Personal System</title>

<style>
:root {
  --accent: #4de7ff;
  --accent-soft: rgba(77,231,255,.13);
  --bg: #050b14;
  --panel: rgba(9,24,40,.82);
  --line: rgba(100,220,255,.22);
  --text: #e7f6ff;
  --muted: #87a4b8;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(ellipse at 50% 35%, #102a40, #071321 48%, #040912 90%);
  color: var(--text);
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

button, input, select, textarea {
  font: inherit;
}

button {
  cursor: pointer;
  color: var(--text);
  background: #0b2336;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px;
}

button:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.ambient {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(circle at 50% 40%, var(--accent-soft), transparent 55%);
}

.grid {
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .12;
  background-image:
    linear-gradient(rgba(100,180,220,.15) 1px, transparent 1px),
    linear-gradient(90deg, rgba(100,180,220,.15) 1px, transparent 1px);
  background-size: 48px 48px;
}

header, footer {
  position: relative;
  z-index: 2;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px clamp(16px, 5vw, 55px);
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 3px;
}

.brand {
  color: var(--text);
  font-size: 15px;
}

#status {
  color: var(--accent);
}

main {
  position: relative;
  z-index: 1;
  width: min(850px, calc(100% - 28px));
  margin: auto;
}

.stage {
  height: 390px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  position: relative;
}

.orbit {
  position: absolute;
  width: 270px;
  height: 270px;
  border: 1px solid var(--line);
  border-radius: 50%;
  animation: spin 24s linear infinite;
}

.orbit::before, .orbit::after {
  content: "";
  position: absolute;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 15px var(--accent);
}

.orbit::before {
  top: 22px;
  left: 40px;
}

.orbit::after {
  bottom: 34px;
  right: 20px;
}

.orbit.second {
  width: 320px;
  height: 320px;
  border-style: dashed;
  opacity: .45;
  animation-direction: reverse;
  animation-duration: 42s;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.core {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  border: 1px solid var(--accent);
  background: radial-gradient(circle at 35% 28%, var(--accent-soft), #07111f 70%);
  box-shadow: 0 0 35px var(--accent-soft), inset 0 0 30px var(--accent-soft);
  display: grid;
  place-items: center;
  z-index: 2;
  transition: .3s;
}

.core-inner {
  width: 105px;
  height: 105px;
  border: 1px solid var(--accent);
  border-radius: 50%;
  display: grid;
  place-items: center;
}

#coreMark {
  font-size: 42px;
  color: var(--accent);
  text-shadow: 0 0 20px var(--accent);
}

.core.listening { animation: pulse 1s infinite; }
.core.processing { animation: pulse .4s infinite; }
.core.speaking { box-shadow: 0 0 65px var(--accent); }

@keyframes pulse {
  50% { transform: scale(1.07); }
}

.identity {
  z-index: 2;
  text-align: center;
  margin-top: 22px;
  font-size: 17px;
  letter-spacing: 5px;
}

.identity small {
  display: block;
  color: var(--accent);
  font-size: 10px;
  margin-top: 9px;
  letter-spacing: 3px;
}

.hint {
  z-index: 2;
  color: var(--muted);
  font-size: 9px;
  letter-spacing: 2px;
  margin-top: 20px;
}

.console, .panel {
  background: var(--panel);
  border: 1px solid var(--line);
  backdrop-filter: blur(20px);
  border-radius: 18px;
  box-shadow: 0 18px 70px #0005;
}

.console {
  padding: 16px;
  margin: 0 auto 25px;
}

.messages {
  height: 190px;
  overflow-y: auto;
  padding: 4px;
}

.message {
  border-left: 2px solid var(--accent);
  padding: 9px 12px;
  margin-bottom: 10px;
  background: #ffffff08;
  border-radius: 0 10px 10px 0;
}

.message b {
  color: var(--accent);
  font-size: 10px;
  letter-spacing: 2px;
}

.message p {
  font-size: 13px;
  line-height: 1.5;
  margin: 5px 0 0;
}

.message.user { border-color: #a7b9c7; }
.message.user b { color: #d7e3ec; }
.message.edith { border-color: #ff526b; }
.message.edith b { color: #ff7181; }
.message.friday { border-color: #bd8cff; }
.message.friday b { color: #bd8cff; }

#commandForm {
  display: flex;
  gap: 8px;
}

input, select, textarea {
  width: 100%;
  min-width: 0;
  padding: 13px;
  color: var(--text);
  background: #06111e;
  border: 1px solid var(--line);
  border-radius: 10px;
}

#commandForm button {
  color: var(--accent);
}

.quickrow {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 12px;
}

.quickrow button {
  flex: 1;
  font-size: 9px;
  color: var(--muted);
}

.panel {
  padding: 17px;
  margin-bottom: 25px;
}

.hidden { display: none !important; }

.panel-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: var(--accent);
  letter-spacing: 2px;
  margin-bottom: 15px;
}

.panel-head button {
  font-size: 20px;
  padding: 4px 11px;
}

.fieldrow {
  display: flex;
  gap: 8px;
  margin: 9px 0;
}

.fieldrow > * { flex: 1; }

.item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 12px;
  margin: 8px 0;
  background: #ffffff08;
  border: 1px solid #ffffff12;
  border-radius: 10px;
  font-size: 13px;
}

.item small {
  display: block;
  color: var(--muted);
  margin-top: 5px;
}

.item button {
  padding: 8px;
}

.muted {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6;
}

footer { font-size: 9px; }

@media(max-width:560px) {
  .stage { height: 350px; }
  .orbit { width: 235px; height: 235px; }
  .orbit.second { width: 275px; height: 275px; }
  .core { width: 132px; height: 132px; }
  .core-inner { width: 94px; height: 94px; }
  .messages { height: 170px; }
  .fieldrow { flex-wrap: wrap; }
}
</style>
</head>

<body>
<div class="ambient"></div>
<div class="grid"></div>

<header>
  <span class="brand">J.A.R.V.I.S.</span>
  <span id="status">LOCAL SYSTEM · READY</span>
</header>

<main>
  <section class="stage">
    <div class="orbit"></div>
    <div class="orbit second"></div>

    <button id="core" class="core" aria-label="Activate assistant">
      <span class="core-inner">
        <span id="coreMark">J</span>
      </span>
    </button>

    <div class="identity">
      <div id="personaName">JARVIS</div>
      <small id="stateText">STANDING BY</small>
    </div>

    <p class="hint">TAP THE CORE TO SPEAK · OR TYPE BELOW</p>
  </section>

  <section class="console">
    <div id="messages" class="messages" aria-live="polite">
      <div class="message">
        <b>JARVIS</b>
        <p>Systems online. Awaiting your instructions.</p>
      </div>
    </div>

    <form id="commandForm">
      <input id="command" placeholder="Talk to JARVIS…" autocomplete="off">
      <button type="submit">SEND</button>
    </form>

    <div class="quickrow">
      <button data-command="Open tasks">TASKS</button>
      <button data-command="Open school">ACADEMICS</button>
      <button data-command="Open memory">MEMORY</button>
      <button data-command="Open settings">SETTINGS</button>
    </div>
  </section>

  <section id="panel" class="panel hidden">
    <div class="panel-head">
      <span id="panelTitle">SYSTEM</span>
      <button id="closePanel">×</button>
    </div>
    <div id="panelBody"></div>
  </section>
</main>

<footer>
  JARVIS PERSONAL SYSTEM
  <span>LOCAL MODE · V1</span>
</footer>

<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);

const store = {
  get(key, fallback) {
    try {
      return JSON.parse(localStorage.getItem("jv_" + key)) ?? fallback;
    } catch {
      return fallback;
    }
  },
  set(key, value) {
    localStorage.setItem("jv_" + key, JSON.stringify(value));
  }
};

let tasks = store.get("tasks", []);
let assignments = store.get("assignments", []);
let memories = store.get("memories", []);

let settings = store.get("settings", {
  voice: true,
  interjections: "balanced",
  edith: true,
  friday: true
});

let persona = store.get("persona", "jarvis");

const personalities = {
  jarvis: {
    name: "JARVIS",
    mark: "J",
    color: "#4de7ff",
    pitch: .9,
    rate: 1
  },
  edith: {
    name: "EDITH",
    mark: "E",
    color: "#ff526b",
    pitch: .85,
    rate: 1.02
  },
  friday: {
    name: "FRIDAY",
    mark: "F",
    color: "#bd8cff",
    pitch: 1.08,
    rate: 1.05
  }
};

function status(text) {
  $("stateText").textContent = text;
}

function setPersona(name) {
  if (!personalities[name]) return;

  persona = name;
  store.set("persona", name);

  const selected = personalities[name];

  document.documentElement.style.setProperty(
    "--accent",
    selected.color
  );

  document.documentElement.style.setProperty(
    "--accent-soft",
    selected.color + "22"
  );

  $("personaName").textContent = selected.name;
  $("coreMark").textContent = selected.mark;
  $("status").textContent = selected.name + " · LOCAL MODE";

  status("STANDING BY");
}

function addMessage(name, text, type = "") {
  const message = document.createElement("div");
  message.className = "message " + type;

  const label = document.createElement("b");
  label.textContent = name;

  const paragraph = document.createElement("p");
  paragraph.textContent = text;

  message.append(label, paragraph);
  $("messages").append(message);

  $("messages").scrollTop = $("messages").scrollHeight;
}

function speak(text, voice = personalities[persona]) {
  if (!settings.voice || !("speechSynthesis" in window)) return;

  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.rate = voice.rate;
  utterance.pitch = voice.pitch;

  utterance.onstart = () => {
    $("core").classList.add("speaking");
    status("SPEAKING");
  };

  utterance.onend = () => {
    $("core").classList.remove("speaking");
    status("STANDING BY");
  };

  speechSynthesis.speak(utterance);
}

function reply(text, voice = personalities[persona], type = "") {
  addMessage(voice.name, text, type);
  speak(text, voice);
}

function saveData() {
  store.set("tasks", tasks);
  store.set("assignments", assignments);
  store.set("memories", memories);
}

function openPanel(title, html) {
  $("panelTitle").textContent = title;
  $("panelBody").innerHTML = html;
  $("panel").classList.remove("hidden");
}

function closePanel() {
  $("panel").classList.add("hidden");
}

$("closePanel").addEventListener("click", closePanel);

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[character]);
}

/* TASK REGISTER */

function openTasks() {
  openPanel("TASK REGISTER", `
    <form id="taskForm" class="fieldrow">
      <input id="taskName" placeholder="Task name" required>
      <input id="taskDate" type="date">
      <button type="submit">ADD</button>
    </form>
    <div id="taskList"></div>
  `);

  renderTasks();

  $("taskForm").addEventListener("submit", event => {
    event.preventDefault();

    tasks.push({
      id: crypto.randomUUID(),
      name: $("taskName").value,
      due: $("taskDate").value,
      done: false
    });

    saveData();
    renderTasks();
    $("taskName").value = "";
  });
}

function renderTasks() {
  const list = $("taskList");
  if (!list) return;

  list.innerHTML = tasks.length
    ? tasks.map(task => `
      <div class="item">
        <div>
          <strong>${escapeHTML(task.name)}</strong>
          <small>${escapeHTML(task.due || "No due date")} · ${task.done ? "Complete" : "Open"}</small>
        </div>
        <div>
          <button data-task-done="${task.id}">${task.done ? "UNDO" : "DONE"}</button>
          <button data-task-delete="${task.id}">×</button>
        </div>
      </div>
    `).join("")
    : `<p class="muted">No tasks yet.</p>`;

  list.querySelectorAll("[data-task-done]").forEach(button => {
    button.onclick = () => {
      const task = tasks.find(item => item.id === button.dataset.taskDone);
      if (!task) return;

      task.done = !task.done;
      saveData();
      renderTasks();
    };
  });

  list.querySelectorAll("[data-task-delete]").forEach(button => {
    button.onclick = () => {
      tasks = tasks.filter(item => item.id !== button.dataset.taskDelete);
      saveData();
      renderTasks();
    };
  });
}

/* ACADEMIC MANAGEMENT */

function openSchool() {
  openPanel("ACADEMIC MANAGEMENT", `
    <p class="muted">
      Add and track your school assignments here.
      Official school-platform connections are not configured.
    </p>

    <form id="assignmentForm" class="fieldrow">
      <input id="className" placeholder="Class" required>
      <input id="assignmentName" placeholder="Assignment" required>
      <input id="assignmentDate" type="date">
      <button type="submit">ADD</button>
    </form>

    <div id="assignmentList"></div>
  `);

  renderAssignments();

  $("assignmentForm").addEventListener("submit", event => {
    event.preventDefault();

    assignments.push({
      id: crypto.randomUUID(),
      klass: $("className").value,
      name: $("assignmentName").value,
      due: $("assignmentDate").value,
      done: false
    });

    saveData();
    renderAssignments();
    $("assignmentName").value = "";
  });
}

function renderAssignments() {
  const list = $("assignmentList");
  if (!list) return;

  list.innerHTML = assignments.length
    ? assignments.map(item => `
      <div class="item">
        <div>
          <strong>${escapeHTML(item.name)}</strong>
          <small>${escapeHTML(item.klass)} · ${escapeHTML(item.due || "No due date")} · ${item.done ? "Complete" : "Open"}</small>
        </div>
        <button data-assignment-done="${item.id}">${item.done ? "UNDO" : "DONE"}</button>
      </div>
    `).join("")
    : `<p class="muted">No assignments entered.</p>`;

  list.querySelectorAll("[data-assignment-done]").forEach(button => {
    button.onclick = () => {
      const item = assignments.find(x => x.id === button.dataset.assignmentDone);
      if (!item) return;

      item.done = !item.done;
      saveData();
      renderAssignments();
    };
  });
}

/* MEMORY ARCHIVE */

function openMemory() {
  openPanel("MEMORY ARCHIVE", `
    <p class="muted">
      Information saved here stays in this browser on this device.
      Only save information you want stored.
    </p>

    <form id="memoryForm" class="fieldrow">
      <input id="memoryText" placeholder="What should I remember?" required>
      <button type="submit">SAVE</button>
    </form>

    <div id="memoryList"></div>
  `);

  renderMemories();

  $("memoryForm").addEventListener("submit", event => {
    event.preventDefault();

    memories.push({
      id: crypto.randomUUID(),
      text: $("memoryText").value
    });

    saveData();
    renderMemories();
    $("memoryText").value = "";
  });
}

function renderMemories() {
  const list = $("memoryList");
  if (!list) return;

  list.innerHTML = memories.length
    ? memories.map(item => `
      <div class="item">
        <span>${escapeHTML(item.text)}</span>
        <button data-memory-delete="${item.id}">DELETE</button>
      </div>
    `).join("")
    : `<p class="muted">Memory archive empty.</p>`;

  list.querySelectorAll("[data-memory-delete]").forEach(button => {
    button.onclick = () => {
      memories = memories.filter(x => x.id !== button.dataset.memoryDelete);
      saveData();
      renderMemories();
    };
  });
}

/* SETTINGS */

function openSettings() {
  openPanel("SYSTEM SETTINGS", `
    <div class="fieldrow">
      <label>
        Voice
        <select id="voiceSetting">
          <option value="yes">On</option>
          <option value="no">Off</option>
        </select>
      </label>

      <label>
        Interjections
        <select id="interjectionSetting">
          <option value="minimal">Minimal</option>
          <option value="balanced">Balanced</option>
          <option value="frequent">Frequent</option>
        </select>
      </label>
    </div>

    <div class="fieldrow">
      <label>
        EDITH
        <select id="edithSetting">
          <option value="yes">Enabled</option>
          <option value="no">Muted</option>
        </select>
      </label>

      <label>
        FRIDAY
        <select id="fridaySetting">
          <option value="yes">Enabled</option>
          <option value="no">Muted</option>
        </select>
      </label>
    </div>

    <p class="muted">
      LOCAL MODE: This version does not provide secure authentication.
      Do not store passwords, financial information, or sensitive documents here.
    </p>

    <button id="backupButton">EXPORT BACKUP</button>
    <button id="clearButton">CLEAR LOCAL DATA</button>
  `);

  $("voiceSetting").value = settings.voice ? "yes" : "no";
  $("interjectionSetting").value = settings.interjections;
  $("edithSetting").value = settings.edith ? "yes" : "no";
  $("fridaySetting").value = settings.friday ? "yes" : "no";

  [
    "voiceSetting",
    "interjectionSetting",
    "edithSetting",
    "fridaySetting"
  ].forEach(id => {
    $(id).onchange = () => {
      settings = {
        voice: $("voiceSetting").value === "yes",
        interjections: $("interjectionSetting").value,
        edith: $("edithSetting").value === "yes",
        friday: $("fridaySetting").value === "yes"
      };

      store.set("settings", settings);
    };
  });

  $("backupButton").onclick = () => {
    const backup = {
      tasks,
      assignments,
      memories,
      settings,
      exportedAt: new Date().toISOString()
    };

    const blob = new Blob(
      [JSON.stringify(backup, null, 2)],
      { type: "application/json" }
    );

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = "jarvis-backup.json";
    link.click();

    URL.revokeObjectURL(url);
  };

  $("clearButton").onclick = () => {
    if (confirm("Delete all JARVIS data stored in this browser?")) {
      localStorage.clear();
      location.reload();
    }
  };
}

/* OVERVIEW */

function overview() {
  const openTasks = tasks.filter(x => !x.done).length;
  const openAssignments = assignments.filter(x => !x.done).length;

  reply(
    `You have ${openTasks} open personal tasks, ` +
    `${openAssignments} open school assignments, and ` +
    `${memories.length} saved memories.`
  );
}

/* PERSONALITY INTERJECTIONS */

function interject(topic) {
  if (settings.interjections === "minimal") return;

  if (
    settings.edith &&
    /security|password|permission|private|code|access/i.test(topic)
  ) {
    addMessage(
      "EDITH",
      "Security note: sensitive actions require explicit approval. Voice alone is not authentication.",
      "edith"
    );
  }

  if (
    settings.friday &&
    settings.interjections === "frequent"
  ) {
    addMessage(
      "FRIDAY",
      "I have a suggestion, if anyone is accepting those today.",
      "friday"
    );
  }
}

/* COMMAND SYSTEM */

function handleCommand(raw) {
  const command = raw.trim();
  if (!command) return;

  addMessage("YOU", command, "user");
  $("command").value = "";

  $("core").classList.add("processing");
  status("PROCESSING");

  const query = command.toLowerCase();

  setTimeout(() => {
    $("core").classList.remove("processing");
    status("STANDING BY");

    if (/^(switch to edith|edith mode)$/.test(query)) {
      setPersona("edith");
      reply("EDITH online. Security protocols remain under your control.");
      return;
    }

    if (/^(switch to friday|friday mode)$/.test(query)) {
      setPersona("friday");
      reply("FRIDAY here. Let's make this less painfully complicated.");
      return;
    }

    if (/^(switch to jarvis|jarvis mode)$/.test(query)) {
      setPersona("jarvis");
      reply("JARVIS online.");
      return;
    }

    if (/\b(open|show).*\b(tasks?)\b/.test(query)) {
      openTasks();
      reply("Task register opened.");
      return;
    }

    if (/\b(open|show).*\b(school|academic|assignments?)\b/.test(query)) {
      openSchool();
      reply("Academic management opened.");
      return;
    }

    if (/\b(open|show).*\b(memory)\b/.test(query)) {
      openMemory();
      reply("Memory archive opened.");
      return;
    }

    if (/\b(open|show).*\b(settings?)\b/.test(query)) {
      openSettings();
      reply("Settings opened.");
      return;
    }

    if (/^(close|hide) (panel|window|that)$/.test(query)) {
      closePanel();
      reply("Panel closed.");
      return;
    }

    if (/\b(overview|daily summary|how much work)\b/.test(query)) {
      overview();
      return;
    }

    if (query.startsWith("remember ")) {
      memories.push({
        id: crypto.randomUUID(),
        text: command.slice(9)
      });

      saveData();
      reply("Saved to local memory.");
      return;
    }

    if (query.startsWith("add task ")) {
      tasks.push({
        id: crypto.randomUUID(),
        name: command.slice(9),
        due: "",
        done: false
      });

      saveData();
      reply("Task added.");
      return;
    }

    if (/\b(help|commands)\b/.test(query)) {
      reply(
        "Try: open tasks, open school, open memory, open settings, " +
        "add task followed by a task name, remember followed by a note, " +
        "daily overview, switch to EDITH, or switch to FRIDAY."
      );
      return;
    }

    interject(command);

    reply(
      "I can manage your local tasks, assignments, memories, settings, " +
      "and personality modes. I am not connected to a real AI reasoning " +
      "service yet. A secure backend is needed for full conversational intelligence."
    );

  }, 300);
}

$("commandForm").addEventListener("submit", event => {
  event.preventDefault();
  handleCommand($("command").value);
});

document.querySelectorAll("[data-command]").forEach(button => {
  button.onclick = () => handleCommand(button.dataset.command);
});

/* VOICE INPUT */

$("core").addEventListener("click", () => {
  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!Recognition) {
    reply("Voice input is not supported here. You can still type commands.");
    return;
  }

  const recognition = new Recognition();

  recognition.lang = "en-US";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    $("core").classList.add("listening");
    status("LISTENING");
  };

  recognition.onend = () => {
    $("core").classList.remove("listening");
    status("STANDING BY");
  };

  recognition.onerror = () => {
    reply("I couldn't access the microphone. Check your browser permissions.");
  };

  recognition.onresult = event => {
    handleCommand(event.results[0][0].transcript);
  };

  try {
    recognition.start();
  } catch {
    reply("Voice input could not start. Try again.");
  }
});

/* INITIALIZE */

setPersona(persona);

})();
</script>
